<app-desk-header [cards]="cards"></app-desk-header>
<main (click)="$event.preventDefault(); addCard($event.clientX, $event.clientY)"
      class="desk-field">
  @for (card of cards$ | async; track card.id) {
    <app-desk-card
      [id]="card.id"
      [x]="card.x"
      [y]="card.y"
      [name]="card.name"
      [icon]="card.icon"
      [desc]="card.desc"
      [conn]="card.conn"
      [cards]="cards"
      (click)="$event.stopPropagation()"
      [style.left.px]="card.x"
      [style.top.px]="card.y"
      (cardSaved)="onCardSaved($event)"
      (cardDeleted)="onCardDeleted($event)"
      cdkDrag>
    </app-desk-card>
  }
</main>
