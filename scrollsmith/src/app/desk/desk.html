<app-desk-header [cards]="cards"></app-desk-header>
<main (click)="$event.preventDefault(); addCard($event.clientX, $event.clientY)">
  @for (card of cards; track card.id) {
    <app-desk-card [id]="card.id" [x]="card.x" [y]="card.y" [name]="card.name" [icon]="card.icon" (click)="$event.stopPropagation()" [style.left.px]="card.x" [style.top.px]="card.y"></app-desk-card>
  }
</main>
