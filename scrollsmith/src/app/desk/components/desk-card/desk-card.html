<div class="desk-card">
  <form class="desk-card-form" (ngSubmit)="saveCard()" [formGroup]="cardForm">
    <label>
      Name:
      <input type="text" formControlName="Name"/>
    </label>
    <label>
      Main image:
      <input type="file" formControlName="Icon"/>
      @if (icon !== '') {
        <img ngSrc="{{icon}}" fill alt="Please select an image">
      }
    </label>
    <label>
      Description:
      <textarea formControlName="Description"></textarea>
    </label>
    <label>
      Connection:
      <select formControlName="Connection">
        @for(card of cards; track card) {
          <option [value]="card.id">{{ card.name }}</option>
        }
      </select>
    </label>
    <input type="submit" value="Save"/>
    <button type="button" (click)="deleteCard()">Delete</button>
  </form>
</div>
