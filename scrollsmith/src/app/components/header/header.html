<header>
  <div id="header-elements">

    <div id="small-logo" (click)="rm.goTo('home')">
      <img src="Logo.png" alt="Scrollsmith"/>
    </div>

    @if (rm.loggedIn && ud.currentUserId !== null) {
      <div id="profile" (click)="rm.goTo('users/'+ud.users[ud.currentUserId].userName)">
        <img src="Profile.png" alt="Profile"/>
        {{ud.currentUserId ? ud.currentUserId : ''}}
      </div>
    } @else {
      <div id="not-logged-in">
        <div id="signup" (click)="rm.goTo('register')">
          Sign up
        </div>
        <div id="login" (click)="rm.goTo('login')">
          Log in
        </div>
      </div>
    }



  </div>
</header>
